services:

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "127.0.0.1:6333:6333"     # bind to localhost only in production
    volumes:
      - ./qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: vidyaai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: vidyaai_db
    ports:
      - "127.0.0.1:5432:5432"     # localhost only
    volumes:
      - ./pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8000:8000"     # Nginx proxies to this
    env_file:
      - .env
    environment:
      APP_ENV: production
    depends_on:
      - qdrant
      - postgres
    volumes:
      - ./ingestion:/app/ingestion
      - ./training/training_data:/app/training/training_data

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro    # for HTTPS (optional)
    depends_on:
      - backend
